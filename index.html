<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Métro 2033 RP - Chargement</title>
<!--
  Écran de chargement du serveur Métro 2033 RP (Garry's Mod)
  Vidéo de la cabine (la même que le menu Échap) en boucle : à la fin du
  chargement, le menu s'ouvre sur le même décor. Le volume suit celui du joueur.
  À mettre dans server.cfg :  sv_loadingurl "https://ADRESSE-DE-LA-PAGE/"
-->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f0f12; }

  /* Vidéo plein écran (image fixe si la vidéo ne se lit pas) */
  #fond {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #0f0f12 url("cabine.jpg") center / cover no-repeat;
  }


  /* Nom du serveur en haut à gauche */
  #nom {
    position: fixed; left: 2.5vw; top: 3vh;
    font-family: "Roboto", Arial, sans-serif; font-weight: 700; font-size: 1.7vw;
    color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
  }
</style>
</head>
<body>

<video id="fond" autoplay loop playsinline poster="cabine.jpg">
  <source src="cabine3.webm" type="video/webm">
  <source src="cabine3.mp4" type="video/mp4">
  <source src="cabine2.webm" type="video/webm">
</video>
<div id="nom">[FR] Projet Metro 2033 RP - LGM | SeriousRP | En construction</div>

<script>
  // Seule la vidéo est affichée : Garry's Mod montre déjà sa propre barre de chargement.
  var VOLUME_MAX = 0.15;   // même volume que la cabine du menu (multiplié par le volume du joueur)
  var video = document.getElementById("fond");
  video.volume = VOLUME_MAX;
  // Un navigateur classique (Chrome…) bloque la lecture avec le son : on relance sans le son.
  // Dans Garry's Mod, la vidéo démarre directement avec son son.
  var essai = video.play();
  if (essai && essai.catch) essai.catch(function () { video.muted = true; video.play(); essayerLeSon(); });

  // Si le son a été coupé au démarrage, on réessaie de l'activer toutes les 2 secondes
  function essayerLeSon() {
    var t = setInterval(function () {
      if (!video.muted) { clearInterval(t); return; }
      video.muted = false;
      var p = video.play();
      if (p && p.catch) p.catch(function () { video.muted = true; video.play(); });
    }, 2000);
  }

  // Appelée par Garry's Mod au début du chargement : le volume suit celui du joueur
  function GameDetails(nomServeur, urlServeur, carte, maxJoueurs, steamid, modeDeJeu, volume, langue) {
    if (nomServeur) document.getElementById("nom").textContent = nomServeur; // nom réel du serveur
    if (typeof volume === "number") video.volume = Math.max(0, Math.min(1, volume)) * VOLUME_MAX;
  }
</script>
</body>
</html>
